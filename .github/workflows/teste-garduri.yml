name: Teste garduri

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  teste-garduri:
    name: teste-garduri
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verifica sintaxa tuturor fisierelor MJS
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "node --check $file"
            node --check "$file"
          done < <(find . -type f -name '*.mjs' -not -path './node_modules/*' -not -path './.git/*' -print0)

      - name: Ruleaza bateria de teste
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/*.test.mjs; do
            echo "=== $test_file ==="
            node "$test_file"
          done

  marcheaza-ci-pass:
    name: marcheaza-ci-pass
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: teste-garduri
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write

    steps:
      - name: Checkout commitul testat
        uses: actions/checkout@v4

      - name: Muta reperul ci-passed numai dupa PASS
        shell: bash
        run: |
          set -euo pipefail
          echo "Toate testele au PASS. Mut refs/heads/ci-passed la ${GITHUB_SHA}."
          git push --force origin "${GITHUB_SHA}:refs/heads/ci-passed"
